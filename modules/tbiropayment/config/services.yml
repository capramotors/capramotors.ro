services:
    _defaults:
        public: true

    # TbiroPayment configuration form
    prestashop.module.tbiropayment.form.type.tbiropayment_configuration:
        class: 'PrestaShop\Module\TbiroPayment\Form\TbiroPaymentConfigurationType'
        parent: 'form.type.translatable.aware'
        public: true
        tags:
            - { name: form.type }

    prestashop.module.tbiropayment.form.tbiropayment_configuration_data_configuration:
        class: PrestaShop\Module\TbiroPayment\Form\TbiroPaymentConfigurationDataConfiguration
        arguments: ['@prestashop.adapter.legacy.configuration']

    prestashop.module.tbiropayment.form.tbiropayment_configuration_form_data_provider:
        class: 'PrestaShop\Module\TbiroPayment\Form\TbiroPaymentConfigurationFormDataProvider'
        arguments:
            - '@prestashop.module.tbiropayment.form.tbiropayment_configuration_data_configuration'

    prestashop.module.tbiropayment.tbiropayment_configuration_form_handler:
        class: 'PrestaShop\PrestaShop\Core\Form\Handler'
        arguments:
            - '@form.factory'
            - '@prestashop.core.hook.dispatcher'
            - '@prestashop.module.tbiropayment.form.tbiropayment_configuration_form_data_provider'
            - 'PrestaShop\Module\TbiroPayment\Form\TbiroPaymentConfigurationType'
            - 'TbiroPaymentConfiguration'
